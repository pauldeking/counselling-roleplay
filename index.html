<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Counselling Role-Play Practice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: #f7f5f2; color: #1c1c1a; min-height: 100%; font-size: 15px; line-height: 1.6; }
#root { height: 100%; }
textarea, button, input, select { font-family: inherit; }
button { cursor: pointer; }
:root {
  --sage:#4a6741; --sage-light:#6a8f60; --sage-pale:#eef3ed; --sage-mid:#c8dcc5;
  --cream:#f7f5f2; --warm:#faf9f7;
  --charcoal:#1c1c1a; --mid:#5a5a55; --muted:#9a9a92;
  --border:#e2ddd8; --border-light:#ede9e4;
  --teal:#1a6b5c; --teal-pale:#e4f2ef; --teal-mid:#a8d4cc;
  --amber:#b06010; --amber-pale:#fdf0e4; --amber-mid:#f0c080;
  --red:#943030; --red-pale:#faeaea; --red-mid:#e0a0a0;
  --indigo:#3c3c8c; --indigo-pale:#eeeeff; --indigo-mid:#b0b0e8;
  --r:10px; --r-lg:16px;
}
.page { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 2rem; }
.label-upper { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; display: block; }
.card { background: var(--warm); border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: 1rem 1.1rem; }
.badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: var(--r); border: none; font-size: 14px; font-weight: 500; transition: opacity 0.15s; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--sage); color: white; }
.btn-primary:hover:not(:disabled) { opacity: 0.9; }
.btn-ghost { background: var(--border-light); color: var(--mid); }
.btn-ghost:hover:not(:disabled) { background: var(--border); }
.approach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 1.5rem; }
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 8px; margin-bottom: 1.5rem; }
.option-row { display: grid; gap: 8px; margin-bottom: 1.5rem; }
.option-row-3 { grid-template-columns: repeat(3, 1fr); }
.option-row-2 { grid-template-columns: repeat(2, 1fr); }
.sel-card { padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--border-light); background: var(--warm); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.sel-card:hover { border-color: var(--border); }
.sel-card.active { border: 2px solid var(--sage); background: var(--sage-pale); }
.sel-card.active-teal { border: 2px solid var(--teal); background: var(--teal-pale); }
.sel-card.active-indigo { border: 2px solid var(--indigo); background: var(--indigo-pale); }
.sel-card.crisis-base { border-color: var(--indigo-mid); background: #f8f8ff; }
.sel-card-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.sel-card-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
.filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.75rem; }
.filter-tab { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--warm); color: var(--mid); cursor: pointer; transition: all 0.15s; }
.filter-tab.active { background: var(--charcoal); color: white; border-color: var(--charcoal); }
.filter-tab.active-crisis { background: var(--indigo); border-color: var(--indigo); color: white; }
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 2rem; }
.qs-card { padding: 12px; border-radius: var(--r); border: 1px solid; cursor: pointer; text-align: left; transition: opacity 0.15s; }
.qs-card:hover { opacity: 0.85; }
.qs-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.qs-desc { font-size: 11px; line-height: 1.4; opacity: 0.8; }
.session-layout { display: flex; flex-direction: column; height: 100dvh; max-width: 680px; margin: 0 auto; }
.session-header { background: var(--warm); border-bottom: 1px solid var(--border-light); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
.chat-area { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.msg-wrap { display: flex; flex-direction: column; }
.msg-wrap.counsellor { align-items: flex-end; }
.msg-wrap.client { align-items: flex-start; }
.msg-bubble { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
.msg-label { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.6; margin-bottom: 3px; }
.msg-wrap.client .msg-bubble { background: var(--warm); border: 1px solid var(--border-light); border-radius: 4px 16px 16px 16px; }
.msg-wrap.counsellor .msg-bubble { background: var(--sage); color: white; border-radius: 16px 4px 16px 16px; }
.msg-wrap.counsellor .msg-label { color: rgba(255,255,255,0.7); }
.typing-bubble { background: var(--warm); border: 1px solid var(--border-light); border-radius: 4px 16px 16px 16px; padding: 12px 16px; display: flex; gap: 4px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,80%,100%{opacity:0.3;transform:scale(0.8);}40%{opacity:1;transform:scale(1);} }
.msg-actions { display: flex; gap: 4px; margin-top: 5px; max-width: 90%; flex-wrap: wrap; align-items: center; }
.msg-reaction-btn { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); background: white; font-size: 11px; color: var(--mid); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.msg-reaction-btn:hover { border-color: var(--sage-mid); background: var(--sage-pale); color: var(--sage); }
.msg-reaction-btn.selected-good { border-color: var(--sage-mid); background: var(--sage-pale); color: var(--sage); font-weight: 500; }
.msg-reaction-btn.selected-amber { border-color: var(--amber-mid); background: var(--amber-pale); color: var(--amber); font-weight: 500; }
.msg-note-btn { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--amber-mid); background: white; font-size: 11px; color: var(--amber); cursor: pointer; transition: all 0.15s; white-space: nowrap; font-weight: 500; }
.msg-note-btn:hover { background: var(--amber-pale); }
.msg-note-btn.has-note { background: var(--amber-pale); }
.msg-actions-divider { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
.msg-note-display { max-width: 78%; margin-top: 4px; padding: 6px 10px; background: #fffbf0; border: 1px solid var(--amber-mid); border-radius: var(--r); font-size: 12px; color: var(--amber); line-height: 1.5; }
.msg-note-display-header { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber); opacity: 0.7; margin-bottom: 2px; }
.note-popup { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid var(--amber-mid); padding: 12px 14px; z-index: 40; max-width: 680px; margin: 0 auto; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); }
.note-popup-context { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-popup-title { font-size: 12px; font-weight: 600; color: var(--amber); margin-bottom: 6px; }
.note-input { width: 100%; border: 1px solid var(--border); border-radius: var(--r); padding: 8px 10px; font-size: 13px; resize: none; outline: none; line-height: 1.5; }
.note-input:focus { border-color: var(--amber-mid); }
.progress-strip { background: #f0ede8; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); padding: 5px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.prog-wrap { height: 6px; background: var(--border-light); border-radius: 3px; flex: 1; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.tooltip-wrap { position: relative; display: inline-flex; }
.tooltip-wrap .tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--charcoal); color: white; font-size: 11px; padding: 5px 9px; border-radius: 6px; pointer-events: none; z-index: 50; line-height: 1.4; max-width: 240px; white-space: normal; text-align: center; }
.tooltip-wrap:hover .tooltip { display: block; }
.fb-card { border-radius: var(--r-lg); padding: 14px 16px; border: 1px solid; }
.fb-section { margin-bottom: 10px; }
.fb-section:last-child { margin-bottom: 0; }
.fb-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.fb-text { font-size: 13px; line-height: 1.6; }
.example-box { padding: 8px 12px; border-radius: 8px; font-size: 13px; font-style: italic; line-height: 1.6; }
.crisis-banner { background: var(--indigo-pale); border: 1px solid var(--indigo-mid); border-radius: var(--r); padding: 10px 14px; margin: 8px 14px 0; flex-shrink: 0; }
.input-area { background: var(--warm); border-top: 1px solid var(--border-light); padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom)); flex-shrink: 0; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.chat-input { flex: 1; resize: none; padding: 9px 12px; font-size: 14px; border-radius: var(--r); border: 1px solid var(--border); background: var(--cream); color: var(--charcoal); line-height: 1.5; min-height: 42px; max-height: 110px; outline: none; transition: border-color 0.15s; }
.chat-input:focus { border-color: var(--sage-mid); }
.chat-input::placeholder { color: var(--muted); }
.send-btn { width: 42px; height: 42px; border-radius: var(--r); background: var(--sage); color: white; border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s; }
.send-btn:hover:not(:disabled) { opacity: 0.85; }
.send-btn:disabled { background: var(--border); cursor: not-allowed; }
.action-row { display: flex; gap: 7px; margin-top: 8px; }
.action-btn { flex: 1; padding: 9px; border-radius: var(--r); border: 1px solid var(--border); font-size: 12px; font-weight: 500; background: var(--warm); color: var(--mid); transition: all 0.15s; cursor: pointer; }
.action-btn:hover:not(:disabled) { border-color: var(--charcoal); color: var(--charcoal); }
.action-btn.primary { background: var(--amber-pale); border-color: var(--amber-mid); color: var(--amber); }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.home-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.75rem; gap: 12px; }
.home-title { font-family: 'Instrument Serif', serif; font-size: 26px; line-height: 1.2; margin-bottom: 4px; }
.home-sub { font-size: 14px; color: var(--mid); }
.pts-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--border-light); background: var(--warm); cursor: pointer; flex-shrink: 0; }
.pts-btn:hover { border-color: var(--border); }
.pts-num { font-size: 20px; font-weight: 600; color: var(--sage); line-height: 1; }
.pts-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 1rem; }
.stat-card { padding: 10px 8px; border-radius: var(--r); border: 1px solid var(--border-light); text-align: center; background: var(--warm); }
.stat-num { font-size: 20px; font-weight: 600; line-height: 1; margin-bottom: 2px; }
.stat-label { font-size: 11px; color: var(--muted); }
.debrief-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
.exchange-counter { font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.eos-form { background: var(--warm); border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: 1.25rem; margin-bottom: 1rem; }
.eos-form input, .eos-form textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--r); padding: 9px 12px; font-size: 14px; outline: none; transition: border-color 0.15s; background: var(--cream); }
.eos-form input:focus, .eos-form textarea:focus { border-color: var(--sage-mid); }
.eos-form label { font-size: 13px; font-weight: 500; color: var(--mid); display: block; margin-bottom: 5px; }
.eos-form .field { margin-bottom: 1rem; }
.star-row { display: flex; gap: 8px; align-items: center; }
.star-btn { width: 40px; height: 40px; border-radius: var(--r); border: 1px solid var(--border); background: var(--cream); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
.star-btn.active { background: var(--amber-pale); border-color: var(--amber-mid); }
.star-btn:hover { border-color: var(--amber-mid); }
.post-debrief-form { background: var(--teal-pale); border: 1px solid var(--teal-mid); border-radius: var(--r-lg); padding: 1.25rem; margin-bottom: 1rem; }
.post-debrief-form textarea { width: 100%; border: 1px solid var(--teal-mid); border-radius: var(--r); padding: 9px 12px; font-size: 13px; outline: none; transition: border-color 0.15s; background: white; resize: vertical; line-height: 1.5; }
.post-debrief-form textarea:focus { border-color: var(--teal); }
.realism-row { display: flex; gap: 8px; flex-wrap: wrap; }
.realism-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--cream); font-size: 12px; font-weight: 500; color: var(--mid); cursor: pointer; transition: all 0.15s; }
.realism-btn:hover { border-color: var(--teal-mid); color: var(--teal); }
.realism-btn.active { border-color: var(--teal); background: var(--teal-pale); color: var(--teal); font-weight: 600; }
/* Skills drills */
.drill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.5rem; }
.drill-card { padding: 10px 10px; border-radius: var(--r); border: 1px solid var(--border-light); background: var(--warm); cursor: pointer; text-align: center; transition: all 0.15s; }
.drill-card:hover { border-color: var(--teal-mid); background: var(--teal-pale); }
.drill-card-emoji { font-size: 20px; margin-bottom: 4px; }
.drill-card-title { font-size: 11px; font-weight: 600; color: var(--charcoal); line-height: 1.3; }
.drill-card-pts { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* Waitlist */
.waitlist-form { background: linear-gradient(135deg, #1a6b5c 0%, #4a6741 100%); border-radius: var(--r-lg); padding: 1.25rem; margin-bottom: 1.5rem; color: white; }
.waitlist-form input { width: 100%; border: none; border-radius: var(--r); padding: 10px 12px; font-size: 14px; outline: none; background: rgba(255,255,255,0.15); color: white; }
.waitlist-form input::placeholder { color: rgba(255,255,255,0.6); }
.waitlist-form input:focus { background: rgba(255,255,255,0.25); }

@media (max-width: 500px) {
  .drill-grid { grid-template-columns: repeat(2, 1fr); }
}

@media print {
  body * { visibility: hidden; }
  #pdf-content, #pdf-content * { visibility: visible; }
  #pdf-content { position: fixed; left: 0; top: 0; width: 100%; padding: 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; line-height: 1.6; color: #1c1c1a; }
}
#pdf-content { display: none; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
@media (max-width: 500px) {
  .quick-grid { grid-template-columns: 1fr; gap: 6px; }
  .approach-grid { grid-template-columns: repeat(2, 1fr); }
  .scenario-grid { grid-template-columns: repeat(2, 1fr); }
  .option-row-3 { grid-template-columns: 1fr 1fr; }
  .debrief-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(3, 1fr); }
  .msg-reaction-btn { font-size: 10px; padding: 2px 6px; }
  .msg-note-btn { font-size: 10px; padding: 2px 7px; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="pdf-content"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const API = "/api/chat";
const STORAGE_KEY = "counselling_v3";

const APPROACHES = [
  { id:"any", label:"Eclectic / Any", desc:"No fixed approach — universal counselling skills evaluated" },
  { id:"person_centred", label:"Person-Centred", desc:"Empathy, unconditional positive regard, congruence" },
  { id:"sfbt", label:"Solution-Focused", desc:"Miracle question, scaling, exceptions, strengths" },
  { id:"cbt", label:"CBT", desc:"Identify thoughts, feelings, behaviours, challenge distortions" },
  { id:"motivational", label:"Motivational Interviewing", desc:"Evoke motivation, explore ambivalence, OARS" },
  { id:"narrative", label:"Narrative Therapy", desc:"Externalise problems, re-author dominant stories" },
  { id:"mindfulness", label:"Mindfulness-Based", desc:"Present-moment awareness, acceptance, grounding" },
  { id:"psychodynamic", label:"Psychodynamic", desc:"Unconscious patterns, early experiences, relational dynamics" },
  { id:"gestalt", label:"Gestalt", desc:"Present focus, unfinished business, contact, experiment" },
  { id:"act", label:"ACT", desc:"Acceptance, defusion, values clarification, psychological flexibility" },
];
const SCENARIOS = [
  {id:"anxiety",label:"Anxiety & Worry",desc:"Overwhelmed by work and constant anxious thoughts",cat:"Mood"},
  {id:"grief",label:"Grief & Loss",desc:"Recently lost a loved one, struggling to cope",cat:"Life Events"},
  {id:"relationship",label:"Relationship Issues",desc:"Conflict and communication breakdown with partner",cat:"Relationships"},
  {id:"career",label:"Career Stress",desc:"Feeling stuck, unfulfilled, and burnt out at work",cat:"Work"},
  {id:"selfesteem",label:"Low Self-Esteem",desc:"Persistent feelings of not being good enough",cat:"Mood"},
  {id:"depression",label:"Low Mood",desc:"Withdrawn, lacking motivation, feeling hopeless",cat:"Mood"},
  {id:"trauma",label:"Past Trauma",desc:"Childhood experiences resurfacing and affecting daily life",cat:"Trauma"},
  {id:"alcohol",label:"Alcohol & Drug Use",desc:"Struggling with alcohol use and wants to cut down",cat:"Substance Use"},
  {id:"family",label:"Family Conflict",desc:"Tension and estrangement from family members",cat:"Relationships"},
  {id:"anger",label:"Anger Management",desc:"Explosive anger affecting relationships and work",cat:"Mood"},
  {id:"social_anxiety",label:"Social Anxiety",desc:"Fear of judgement in social situations, avoids going out",cat:"Mood"},
  {id:"divorce",label:"Separation & Divorce",desc:"Going through a difficult divorce with children involved",cat:"Life Events"},
  {id:"chronic_illness",label:"Chronic Illness",desc:"Adjusting to life with a long-term health condition",cat:"Life Events"},
  {id:"identity",label:"Identity & Purpose",desc:"Questioning sense of self, values, and life direction",cat:"Existential"},
  {id:"loneliness",label:"Loneliness & Isolation",desc:"No close connections, feels invisible and forgotten",cat:"Relationships"},
  {id:"parenting",label:"Parenting Stress",desc:"Overwhelmed by parenting demands, feeling like a failure",cat:"Relationships"},
  {id:"financial",label:"Financial Stress",desc:"Debt and financial pressure causing significant distress",cat:"Work"},
  {id:"bereavement_child",label:"Child Bereavement",desc:"Parent grieving the loss of a child, unable to move forward",cat:"Trauma"},
  {id:"crisis_suicidal",label:"Suicidal Ideation",desc:"Client discloses passive thoughts of not wanting to be alive",cat:"Crisis"},
  {id:"crisis_selfharm",label:"Self-Harm Disclosure",desc:"Client reveals recent self-harming behaviour",cat:"Crisis"},
  {id:"crisis_dv",label:"Domestic Violence",desc:"Client discloses ongoing abuse at home",cat:"Crisis"},
  {id:"crisis_distress",label:"Acute Distress",desc:"Client presents highly distressed and overwhelmed",cat:"Crisis"},
];
const CRISIS_IDS = ["crisis_suicidal","crisis_selfharm","crisis_dv","crisis_distress"];
const DIFFICULTIES = [
  {id:"beginner",label:"Beginner",desc:"Cooperative and open, responds well to empathy",pts:1,color:"var(--sage)",pale:"var(--sage-pale)",border:"var(--sage-mid)"},
  {id:"intermediate",label:"Intermediate",desc:"Some resistance, occasional deflection or minimising",pts:2,color:"var(--amber)",pale:"var(--amber-pale)",border:"var(--amber-mid)"},
  {id:"advanced",label:"Advanced",desc:"Defensive, guarded — only opens up with skilled work",pts:3,color:"var(--red)",pale:"var(--red-pale)",border:"var(--red-mid)"},
];
const FEEDBACK_MODES = [
  {id:"step",label:"Step-by-Step",desc:"Supervisor feedback after each counsellor response"},
  {id:"end",label:"End of Session",desc:"Full immersive role-play, supervisor debrief at the end"},
];
const SESSION_LENGTHS = [
  {id:"short",label:"Short",desc:"~5 exchanges",max:5},
  {id:"standard",label:"Standard",desc:"~10 exchanges",max:10},
  {id:"extended",label:"Extended",desc:"~20 exchanges",max:20},
];
const CRISIS_GUIDANCE = {
  crisis_suicidal:["Ask directly and calmly — asking does not increase risk","Assess: frequency, intent, plan, means","Stay present and empathic before problem-solving","Discuss safety plans and crisis lines (Lifeline: 13 11 14)","Mandatory reporting obligations may apply"],
  crisis_selfharm:["Stay calm — your reaction matters enormously","Ask about the behaviour without shame or alarm","Assess current safety and any medical needs first","Explore the function — what does it do for them?","Collaborate on safer coping alternatives"],
  crisis_dv:["Believe and validate — never minimise or question","Do not pressure them to leave — safety first","Explore immediate risk: is there danger tonight?","Provide information about DV supports (1800RESPECT)","Mandatory reporting if children are at risk"],
  crisis_distress:["Slow down and use simple, clear language","Ground them: name, place, time, what they can see","Assess immediate safety before anything else","Do not challenge distorted thinking directly","Consider urgent referral if needed"],
};
const CRISIS_CLIENT = {
  crisis_suicidal:"You are a client who has just disclosed passive suicidal thoughts — not in immediate danger but clearly distressed. You may minimise or feel ashamed.",
  crisis_selfharm:"You are a client who has just disclosed self-harming. You feel embarrassed and need the counsellor to stay calm and non-judgmental.",
  crisis_dv:"You are a client disclosing partner abuse. You are ambivalent — you still love them and are scared. You need empathy, not pressure to leave.",
  crisis_distress:"You are a client in acute distress — overwhelmed, thoughts racing. You need grounding and calm presence.",
};
const DIFF_TEXT = {
  beginner:"You are cooperative and open. You respond to empathy positively and gradually share more as trust builds.",
  intermediate:"You have some resistance. You occasionally go off-topic, minimise feelings, or give brief answers. You open up when the counsellor shows genuine understanding.",
  advanced:"You are defensive and guarded. You challenge, deflect, or shut down when pushed. You only open up meaningfully when the counsellor demonstrates real skill and patience.",
};
const AP_LABEL = {any:"Eclectic",person_centred:"Person-Centred",sfbt:"Solution-Focused",cbt:"CBT",motivational:"Motivational Interviewing",narrative:"Narrative Therapy",mindfulness:"Mindfulness-Based",psychodynamic:"Psychodynamic",gestalt:"Gestalt",act:"ACT"};

const RP = {good:3,okay:1,needs_work:0};

];

const DRILLS = [
  { id:"reflection", emoji:"🪞", label:"Reflection of Feeling", desc:"Reflect the emotion back accurately", prompt:"Focus only on reflecting the feeling — not content. Mirror the emotion you hear.", evalKey:"reflection" },
  { id:"open_q", emoji:"❓", label:"Open Questioning", desc:"Use open questions to explore", prompt:"Every response must include at least one open question. Avoid yes/no questions entirely.", evalKey:"open questioning" },
  { id:"paraphrase", emoji:"💬", label:"Paraphrasing", desc:"Restate content in your own words", prompt:"Paraphrase what the client said — restate the content in your own words, not a reflection of feeling.", evalKey:"paraphrasing" },
  { id:"summarise", emoji:"📋", label:"Summarising", desc:"Summarise 2-3 client statements", prompt:"After the client has spoken 2-3 times, offer a concise summary of what they have shared.", evalKey:"summarising" },
  { id:"empathy", emoji:"❤️", label:"Empathic Responding", desc:"Lead with empathy before anything else", prompt:"Every response must lead with empathy — acknowledge the feeling before asking or exploring anything.", evalKey:"empathic responding" },
  { id:"noticing", emoji:"👁️", label:"Noticing & Naming", desc:"Notice what's happening and name it", prompt:"Notice something about the client's experience, tone, or shift and name it gently.", evalKey:"noticing and naming" },
  { id:"challenging", emoji:"⚡", label:"Challenging", desc:"Gently challenge inconsistencies", prompt:"Identify and gently challenge an inconsistency, avoidance, or discrepancy — without damaging rapport. This is an advanced skill; empathy first.", evalKey:"challenging" },
  { id:"reframing", emoji:"🔄", label:"Reframing", desc:"Offer an alternative perspective", prompt:"Offer a reframe — an alternative way of seeing the situation that opens new possibilities.", evalKey:"reframing" },
];

function loadProg() { try { const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):{sessions:[],totalSessions:0,totalPoints:0}; } catch{return{sessions:[],totalSessions:0,totalPoints:0};} }
function saveProg(d) { try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{} }
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function formatTime(ts){ const d=new Date(ts); return d.toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}); }
function formatDate(ds){ try{ return new Date(ds).toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"}); }catch{ return ds; } }
function truncate(str,n){ return str&&str.length>n?str.slice(0,n)+"…":str; }
function ratingStyle(r){
  if(r==="good") return {bg:"var(--sage-pale)",border:"var(--sage-mid)",color:"var(--sage)",label:"Good"};
  if(r==="okay") return {bg:"var(--amber-pale)",border:"var(--amber-mid)",color:"var(--amber)",label:"Okay"};
  return {bg:"var(--red-pale)",border:"var(--red-mid)",color:"var(--red)",label:"Needs work"};
}

async function saveAllToSupabase(sessionData) {
  try {
    const res = await fetch("/api/db", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(sessionData),
    });
    const text = await res.text();
    if (!res.ok) {
      console.error("Save failed:", res.status, text);
      return { ok: false, error: text };
    }
    console.log("Saved successfully:", text);
    return { ok: true };
  } catch(e) {
    console.error("Save error:", e);
    return { ok: false, error: e.message };
  }
}

function App(){
  // Load saved email from localStorage
  const savedEmail = (() => { try { return localStorage.getItem("crp_email")||""; } catch{ return ""; } })();
  const savedName = (() => { try { return localStorage.getItem("crp_name")||""; } catch{ return ""; } })();

  const [screen,setScreen]=useState("home");
  const [approach,setApproach]=useState([]);
  const [showDisclaimer,setShowDisclaimer]=useState(!savedEmail); // skip if already have email
  const [showEmailCapture,setShowEmailCapture]=useState(false);
  const [emailInput,setEmailInput]=useState("");
  const [nameInput,setNameInput]=useState("");
  const [emailError,setEmailError]=useState("");
  const [userEmail,setUserEmail]=useState(savedEmail);
  const [userName,setUserName]=useState(savedName);
  const [scenario,setScenario]=useState(null);
  const [difficulty,setDifficulty]=useState(null);
  const [feedbackMode,setFeedbackMode]=useState(null);
  const [sessionLength,setSessionLength]=useState(null);
  const [filterCat,setFilterCat]=useState("All");
  const [messages,setMessages]=useState([]);
  const [msgReactions,setMsgReactions]=useState({});
  const [msgNotes,setMsgNotes]=useState({});
  const [activeNoteFor,setActiveNoteFor]=useState(null);
  const [noteText,setNoteText]=useState("");
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [stepFeedback,setStepFeedback]=useState(null);
  const [showingFeedback,setShowingFeedback]=useState(false);
  const [finalFeedback,setFinalFeedback]=useState(null);
  const [gettingFinal,setGettingFinal]=useState(false);
  const [progress,setProgress]=useState(loadProg);
  const [showCrisisGuide,setShowCrisisGuide]=useState(false);
  const [exchangeCount,setExchangeCount]=useState(0);
  // Pre-debrief form
  const [studentName,setStudentName]=useState("");
  const [studentEmail,setStudentEmail]=useState("");
  const [sessionDate,setSessionDate]=useState(new Date().toISOString().split("T")[0]);
  const [selfRating,setSelfRating]=useState(0);
  const [reflection,setReflection]=useState("");
  // Post-debrief feedback
  const [debriefRating,setDebriefRating]=useState(0);
  const [debriefMissed,setDebriefMissed]=useState("");
  const [clientRealism,setClientRealism]=useState("");
  const [feedbackSaved,setFeedbackSaved]=useState(false);
  const [savingFeedback,setSavingFeedback]=useState(false);
  // Pending session data — held until post-debrief feedback submitted
  const [pendingSessionData,setPendingSessionData]=useState(null);

  // Drill state
  const [activeDrill,setActiveDrill]=useState(null);
  const [drillMessages,setDrillMessages]=useState([]);
  const [drillInput,setDrillInput]=useState("");
  const [drillLoading,setDrillLoading]=useState(false);
  const [drillExchange,setDrillExchange]=useState(0);
  const [drillFeedbacks,setDrillFeedbacks]=useState([]);
  const [drillDone,setDrillDone]=useState(false);

  // Waitlist state
  const [waitlistEmail,setWaitlistEmail]=useState("");
  const [waitlistSent,setWaitlistSent]=useState(false);
  const [waitlistLoading,setWaitlistLoading]=useState(false);

  const bottomRef=useRef(null);
  const noteInputRef=useRef(null);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages,stepFeedback,finalFeedback,loading]);
  useEffect(()=>{ if(activeNoteFor&&noteInputRef.current) noteInputRef.current.focus(); },[activeNoteFor]);

  const toggleApproach=(id)=>setApproach(prev=>{
    if(id==="any") return prev.includes("any")?[]:["any"];
    const base=prev.filter(a=>a!=="any");
    return base.includes(id)?base.filter(a=>a!==id):[...base,id];
  });
  const getApLabel=(ap)=>(!ap||ap.length===0||ap.includes("any"))?"Eclectic":ap.map(id=>AP_LABEL[id]).join(" + ");
  const isCrisis=CRISIS_IDS.includes(scenario);
  const canStart=approach.length>0&&scenario&&difficulty&&feedbackMode&&sessionLength;
  const maxEx=SESSION_LENGTHS.find(s=>s.id===sessionLength)?.max||10;
  const filtered=filterCat==="All"?SCENARIOS:filterCat==="Crisis"?SCENARIOS.filter(s=>CRISIS_IDS.includes(s.id)):SCENARIOS.filter(s=>s.cat===filterCat&&!CRISIS_IDS.includes(s.id));

  const callAPI=async(system,msgs,max=800)=>{
    const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:max,system,messages:msgs})});
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    return data.content[0].text;
  };

  const clientSystem=(ap,sc,diff)=>{
    const sc_=SCENARIOS.find(s=>s.id===sc);
    const apText=getApLabel(ap);
    if(CRISIS_IDS.includes(sc)) return `You are playing a counselling client in a crisis training scenario. ${CRISIS_CLIENT[sc]} The counsellor is practising ${apText}. Keep responses to 2-4 sentences. Stay fully in character.`;
    return `You are playing a counselling client in a training role-play. Scenario: ${sc_.label} — ${sc_.desc}. Counsellor approach: ${apText}. Difficulty: ${DIFF_TEXT[diff]}. Keep responses to 2-4 sentences. Stay fully in character. Begin by briefly presenting your situation.`;
  };

  const supervisorSystem=(mode,ap,sc,diff)=>{
    const sc_=SCENARIOS.find(s=>s.id===sc);
    const isAny=!ap||ap.length===0||ap.includes("any");
    const apNames=ap.filter(id=>id!=="any").map(id=>APPROACHES.find(a=>a.id===id)?.label).filter(Boolean);
    const approachGuide=isAny?"Evaluate universal counselling skills: empathy, active listening, reflection of feeling, open questions, paraphrasing, summarising, pacing.":`Evaluate use of ${apNames.join(" and ")} techniques specifically, as well as general counselling skills.`;
    const crisisNote=CRISIS_IDS.includes(sc)?`This is a CRISIS scenario (${sc_.label}). Assess: Did they stay calm? Ask directly about risk? Show empathy before problem-solving?`:"";
    if(mode==="step") return `You are a counselling supervisor giving brief formative feedback. ${approachGuide} ${crisisNote} Use Australian English. Be warm but HONEST. Do NOT reframe poor responses positively.

IMPORTANT for crisis scenarios: follow a GRADUATED assessment approach. Sequence: (1) reflect and validate, (2) clarify ideation, (3) explore frequency and intensity, (4) explore intent, (5) plan and means. Suggest only the NEXT appropriate step.

Respond ONLY with valid JSON (no markdown):
{"rating":"good|okay|needs_work","strength":"1-2 honest sentences","improve":"1-2 clear sentences","example":"stronger alternative response","technique":"one technique name"}`;
    return `You are a counselling supervisor writing a detailed session debrief. ${approachGuide} ${crisisNote} Use Australian English. Be honest and specific. Reference specific things the student said.

Respond ONLY with valid JSON (no markdown):
{"overall":"good|okay|needs_work","summary":"3-5 sentences referencing specific moments","strengths":["3-4 specific strengths with clinical reasoning"],"areas":["3-4 areas to develop with concrete suggestions"],"technique_use":"2-3 sentences on approach use with examples","relational_quality":"2-3 sentences on rapport and empathy","key_moment":"The single most important moment and what it reveals","example_response":"A full example stronger response in first person"}`;
  };

  const doStart=async(ap,sc,diff,fm,len)=>{
    setScreen("session"); setLoading(true);
    setMessages([]); setMsgReactions({}); setMsgNotes({});
    setActiveNoteFor(null); setNoteText("");
    setStepFeedback(null); setFinalFeedback(null); setPendingSessionData(null);
    setShowCrisisGuide(false); setExchangeCount(0); setShowingFeedback(false);
    setStudentName(""); setStudentEmail(""); setSelfRating(0); setReflection("");
    setDebriefRating(0); setDebriefMissed(""); setClientRealism("");
    setFeedbackSaved(false); setSavingFeedback(false);
    setSessionDate(new Date().toISOString().split("T")[0]);
    try {
      const text=await callAPI(clientSystem(ap,sc,diff),[{role:"user",content:"Begin the session."}]);
      setMessages([{role:"client",text,id:"msg_"+Date.now()}]);
    } catch(e) {
      setMessages([{role:"client",text:"Something went wrong. Please try again.",id:"msg_"+Date.now()}]);
    }
    setLoading(false);
  };

  const quickStart=(type)=>{
    const nonC=SCENARIOS.filter(s=>!CRISIS_IDS.includes(s.id));
    const crC=SCENARIOS.filter(s=>CRISIS_IDS.includes(s.id));
    const nonAny=APPROACHES.filter(a=>a.id!=="any");
    let sc,ap=[pick(nonAny).id],diff,fm=pick(FEEDBACK_MODES).id,len="standard";
    if(type==="random"){sc=pick(nonC).id;diff=pick(DIFFICULTIES).id;}
    else if(type==="challenge"){sc=pick(nonC).id;diff="advanced";}
    else{sc=pick(crC).id;diff=pick([DIFFICULTIES[0],DIFFICULTIES[1]]).id;}
    setApproach(ap);setScenario(sc);setDifficulty(diff);setFeedbackMode(fm);setSessionLength(len);
    doStart(ap,sc,diff,fm,len);
  };

  const setMsgReaction=(msgId,reactionId)=>{
    setMsgReactions(prev=>{
      if(prev[msgId]===reactionId){ const n={...prev}; delete n[msgId]; return n; }
      return {...prev,[msgId]:reactionId};
    });
  };

  const openNoteFor=(msgId)=>{
    if(activeNoteFor===msgId){ setActiveNoteFor(null); setNoteText(""); return; }
    setNoteText(msgNotes[msgId]?.text||"");
    setActiveNoteFor(msgId);
  };

  const saveNote=()=>{
    if(!noteText.trim()||!activeNoteFor) return;
    const msg=messages.find(m=>m.id===activeNoteFor);
    setMsgNotes(prev=>({...prev,[activeNoteFor]:{text:noteText.trim(),timestamp:Date.now(),msgText:msg?.text||"",exchangeNum:exchangeCount}}));
    setActiveNoteFor(null); setNoteText("");
  };

  const deleteNote=(msgId)=>{ setMsgNotes(prev=>{ const n={...prev}; delete n[msgId]; return n; }); };

  const sendMessage=async()=>{
    if(!input.trim()||loading||showingFeedback||activeNoteFor) return;
    const userText=input.trim(); setInput("");
    const msgId="msg_"+Date.now();
    const msg={role:"counsellor",text:userText,id:msgId};
    const newMsgs=[...messages,msg];
    setMessages(newMsgs); setLoading(true); setStepFeedback(null);
    const newCount=exchangeCount+1; setExchangeCount(newCount);
    if(feedbackMode==="step"){
      try{
        const transcript=newMsgs.map(m=>`${m.role==="counsellor"?"Counsellor":"Client"}: ${m.text}`).join("\n");
        const sc_=SCENARIOS.find(s=>s.id===scenario);
        const raw=await callAPI(supervisorSystem("step",approach,scenario,difficulty),
          [{role:"user",content:`Approach: ${getApLabel(approach)}\nScenario: ${sc_.label}\nDifficulty: ${difficulty}\n\nTranscript:\n${transcript}\n\nRate the counsellor's last message: "${userText}"`}],700);
        let parsed;
        try{const m=raw.match(/\{[\s\S]*\}/);parsed=JSON.parse(m?m[0]:raw.trim());}
        catch{parsed={rating:"okay",strength:"Attempted response.",improve:"Focus on the client's emotional experience.",example:"Try reflecting what the client is feeling.",technique:"Reflection"};}
        setStepFeedback(parsed); setShowingFeedback(true);
      }catch{
        setStepFeedback({rating:"okay",strength:"Could not load feedback.",improve:"Check your connection.",example:"Try again.",technique:"—"});
        setShowingFeedback(true);
      }
      setLoading(false);
    } else { await getClientReply(newMsgs); }
  };

  const getClientReply=async(msgs)=>{
    const history=msgs.map(m=>({role:m.role==="counsellor"?"user":"assistant",content:m.text}));
    try{
      const text=await callAPI(clientSystem(approach,scenario,difficulty),history);
      setMessages(prev=>[...prev,{role:"client",text,id:"msg_"+Date.now()}]);
    }catch{
      setMessages(prev=>[...prev,{role:"client",text:"Sorry, can you say that again?",id:"msg_"+Date.now()}]);
    }
    setLoading(false);
  };

  const continueAfterFeedback=async()=>{

    if(!drillInput.trim()||drillLoading||drillDone) return;

The student is doing a focused drill on this skill only. Evaluate ONLY whether they demonstrated ${activeDrill.evalKey} effectively.
Use Australian English. Be direct and specific.
Respond ONLY with valid JSON (no markdown):
{"rating":"good|okay|needs_work","did_the_skill":true|false,"feedback":"1-2 sentences on whether they demonstrated ${activeDrill.evalKey} and how","tip":"one concrete tip to improve"}`,

            {isCrisis&&<span className="badge" style={{background:"var(--indigo-pale)",color:"var(--indigo)"}}>Crisis</span>}
          </div>
          <button className="btn btn-ghost" style={{padding:"5px 12px",fontSize:13}} onClick={reset}>End</button>
        </div>
        <div className="progress-strip">
          <div className="prog-wrap">
            <div className="prog-fill" style={{width:`${progPct}%`,background:nearEnd?"var(--amber)":"var(--sage)"}}/>
          </div>
          <span className="exchange-counter" style={{color:nearEnd?"var(--amber)":"var(--muted)"}}>
            {nearEnd?"Consider finishing":exchangeCount+" / "+maxEx+" exchanges"}
          </span>
        </div>
        {isCrisis&&(
          <div className="crisis-banner">
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontSize:13,fontWeight:500,color:"var(--indigo)"}}>⚠ Crisis scenario — practise safe response</span>
              <button onClick={()=>setShowCrisisGuide(v=>!v)} style={{fontSize:12,color:"var(--indigo)",background:"none",border:"none",cursor:"pointer",fontWeight:500}}>{showCrisisGuide?"Hide":"Show"} guide</button>
            </div>
            {showCrisisGuide&&guide&&(
              <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid var(--indigo-mid)"}}>
                {guide.map((tip,i)=><p key={i} style={{fontSize:12,color:"var(--indigo)",margin:"0 0 3px",lineHeight:1.5}}>· {tip}</p>)}
                <p style={{fontSize:11,color:"var(--muted)",margin:"7px 0 0",fontStyle:"italic"}}>Training simulation. Always follow your institution's actual crisis protocols.</p>
              </div>
            )}
          </div>
        )}
        <div className="chat-area">
          {messages.map((m,i)=>{
            const isCounsellor=m.role==="counsellor";
            const isLastCounsellor=m.id===lastCounsellorMsgId;
            const selectedReaction=msgReactions[m.id];
            const attachedNote=msgNotes[m.id];
            const isNotingThis=activeNoteFor===m.id;
            return(
              <div key={i} className={`msg-wrap ${m.role}`}>
                <div className="msg-bubble">
                  <div className="msg-label">{isCounsellor?"You (Counsellor)":"Client"}</div>
                  {m.text}
                </div>
                {isCounsellor&&(
                  <div className="msg-actions">
                    {isLastCounsellor&&!selectedReaction
                      ? REACTIONS.map(r=>(
                          <div className="tooltip-wrap" key={r.id}>
                            <button className="msg-reaction-btn" onClick={()=>setMsgReaction(m.id,r.id)}>{r.emoji} {r.label}</button>
                            <div className="tooltip">{r.id==="went_well"?"This exchange felt effective — good technique or connection":r.id==="breakthrough"?"Something clicked — an insight or meaningful shift":r.id==="unsure"?"Not sure if that was right — worth reflecting on":"Felt stuck or uncertain how to proceed"}</div>
                          </div>
                        ))
                      : selectedReaction&&(()=>{
                          const r=REACTIONS.find(r=>r.id===selectedReaction);
                          return(<div className="tooltip-wrap"><button className={`msg-reaction-btn ${r?.colorClass}`} onClick={()=>setMsgReaction(m.id,selectedReaction)}>{r?.emoji} {r?.label}</button><div className="tooltip">Click to remove</div></div>);
                        })()
                    }
                    {(isLastCounsellor||selectedReaction)&&<div className="msg-actions-divider"/>}
                    <div className="tooltip-wrap">
                      <button className={`msg-note-btn ${attachedNote?"has-note":""} ${isNotingThis?"has-note":""}`} onClick={()=>openNoteFor(m.id)}>
                        📝 {attachedNote?"Edit note":"Add note"}
                      </button>
                      <div className="tooltip">Capture what you noticed or wanted to try differently at this moment</div>
                    </div>
                  </div>
                )}
                {isCounsellor&&attachedNote&&!isNotingThis&&(
                  <div className="msg-note-display">
                    <div className="msg-note-display-header">📝 Your note · {formatTime(attachedNote.timestamp)}</div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <span>{attachedNote.text}</span>
                      <button onClick={()=>deleteNote(m.id)} style={{background:"none",border:"none",color:"var(--amber)",fontSize:11,cursor:"pointer",opacity:0.6,flexShrink:0,padding:0}}>✕</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {loading&&(
            <div className="msg-wrap client">
              <div className="typing-bubble"><div className="dot"/><div className="dot"/><div className="dot"/></div>
            </div>
          )}
          {stepFeedback&&showingFeedback&&(()=>{
            const rs=ratingStyle(stepFeedback.rating);
            return(
              <div className="fb-card" style={{background:rs.bg,borderColor:rs.border,margin:"4px 0"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <span className="badge" style={{background:rs.color,color:"white"}}>{rs.label}</span>
                  <span style={{fontSize:13,fontWeight:500,color:rs.color}}>Supervisor Feedback</span>
                  {stepFeedback.technique&&stepFeedback.technique!=="—"&&(
                    <span className="badge" style={{background:"rgba(0,0,0,0.06)",color:rs.color,fontSize:10}}>{stepFeedback.technique}</span>
                  )}
                </div>
                <div className="fb-section"><div className="fb-label" style={{color:rs.color}}>✓ What worked</div><div className="fb-text">{stepFeedback.strength}</div></div>
                <div className="fb-section"><div className="fb-label" style={{color:rs.color}}>↑ To improve</div><div className="fb-text">{stepFeedback.improve}</div></div>
                {stepFeedback.example&&(
                  <div className="fb-section">
                    <div className="fb-label" style={{color:rs.color}}>💬 Stronger response</div>
                    <div className="example-box" style={{background:"rgba(255,255,255,0.6)",color:"var(--mid)"}}>"{stepFeedback.example}"</div>
                  </div>
                )}
                <button className="btn btn-ghost" style={{marginTop:4,fontSize:13}} onClick={continueAfterFeedback}>Continue session →</button>
              </div>
            );
          })()}
          <div ref={bottomRef}/>
        </div>
        {activeNoteFor&&(()=>{
          const msg=messages.find(m=>m.id===activeNoteFor);
          return(
            <div className="note-popup">
              <div className="note-popup-context">Noting: "{truncate(msg?.text,70)}"</div>
              <div className="note-popup-title">📝 What did you notice about this response?</div>
              <textarea ref={noteInputRef} className="note-input" rows={3}
                placeholder="e.g. I wasn't sure whether to reflect or ask a question here… / I felt I moved too quickly past their emotion…"
                value={noteText} onChange={e=>setNoteText(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();saveNote();}}}
              />
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button className="btn btn-primary" style={{flex:1,padding:"8px",background:"var(--amber)",border:"none"}} onClick={saveNote}>Save note</button>
                <button className="btn btn-ghost" style={{padding:"8px 14px"}} onClick={()=>{setActiveNoteFor(null);setNoteText("");}}>Cancel</button>
              </div>
            </div>
          );
        })()}
        <div className="input-area">
          <div className="input-row">
            <textarea className="chat-input" rows={1} value={input}
              onChange={e=>{setInput(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";}}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}}
              placeholder="Type your counsellor response…" disabled={loading||showingFeedback||!!activeNoteFor}/>
            <button className="send-btn" disabled={loading||showingFeedback||!!activeNoteFor||!input.trim()} onClick={sendMessage}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8l12-6-5 14-2-5-5-3z" stroke="white" strokeWidth="1.5" strokeLinejoin="round" fill="none"/></svg>
            </button>
          </div>
          <div className="action-row">
            <button className={`action-btn ${exchangeCount>=2?"primary":""}`} disabled={exchangeCount<2||gettingFinal||loading} onClick={getFinalFeedback}>
              {gettingFinal?"Getting debrief…":"Finish & get debrief"}
            </button>
          </div>
          <p style={{fontSize:11,color:"var(--muted)",textAlign:"center",marginTop:5}}>Enter to send · Shift+Enter for new line</p>
        </div>
      </div>
    );
  }

  // ── FEEDBACK ──
  if(screen==="feedback"){
    const diff_=DIFFICULTIES.find(d=>d.id===difficulty);
    const sc_=SCENARIOS.find(s=>s.id===scenario);
    const earned=finalFeedback?(RP[finalFeedback.overall]||0)*diff_.pts:0;
    const rs=finalFeedback?ratingStyle(finalFeedback.overall):ratingStyle("okay");
    const reactionCounts={};
    Object.values(msgReactions).forEach(r=>{reactionCounts[r]=(reactionCounts[r]||0)+1;});
    const notesArray=Object.entries(msgNotes).map(([msgId,n])=>({msgId,...n}));
    const reactionsArray=Object.entries(msgReactions).map(([msgId,type])=>({msgId,type,msgText:messages.find(m=>m.id===msgId)?.text||""}));

    return(
      <div className="page">
        <div style={{marginBottom:"1.5rem"}}>
          <div style={{fontFamily:"Instrument Serif, serif",fontSize:24,marginBottom:4}}>Session Debrief</div>
          <div style={{fontSize:13,color:"var(--mid)"}}>{getApLabel(approach)} · {sc_?.label} · {diff_?.label}{isCrisis?" · Crisis":""} · {exchangeCount} exchanges</div>
          {(studentName||userName)&&<div style={{fontSize:13,color:"var(--mid)",marginTop:2}}>{studentName||userName}{userEmail?" · "+userEmail:""} · {formatDate(sessionDate)}</div>}
        </div>

        <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:"var(--r-lg)",background:"var(--sage-pale)",border:"1px solid var(--sage-mid)",marginBottom:"1rem"}}>
          <div style={{fontSize:28,fontWeight:700,color:"var(--sage)",fontFamily:"Instrument Serif, serif"}}>+{earned}</div>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--sage)"}}>Points earned</div>
            <div style={{fontSize:12,color:"var(--sage-light)"}}>{rs.label} × {diff_?.pts} difficulty · Total: {progress.totalPoints} pts</div>
          </div>
        </div>

        {(Object.keys(msgReactions).length>0||notesArray.length>0)&&(
          <div className="card" style={{marginBottom:"1rem",background:"#fffbf0",borderColor:"var(--amber-mid)"}}>
            <div className="fb-label" style={{color:"var(--amber)",marginBottom:8}}>Your in-session feedback</div>
            {Object.keys(msgReactions).length>0&&(
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:notesArray.length>0?10:0}}>
                {REACTIONS.map(r=>reactionCounts[r.id]?(
                  <span key={r.id} style={{fontSize:12,padding:"3px 10px",borderRadius:20,background:"white",border:"1px solid var(--amber-mid)",color:"var(--amber)"}}>
                    {r.emoji} {r.label} ×{reactionCounts[r.id]}
                  </span>
                ):null)}
              </div>
            )}
            {notesArray.map((n,i)=>(
              <div key={i} style={{fontSize:13,padding:"7px 10px",background:"white",borderRadius:"var(--r)",border:"1px solid var(--border-light)",marginBottom:5,lineHeight:1.5}}>
                <div style={{fontSize:11,color:"var(--muted)",marginBottom:2}}>{formatTime(n.timestamp)} · On: "{truncate(n.msgText,60)}"</div>
                {n.text}
              </div>
            ))}
          </div>
        )}

        {selfRating>0&&(
          <div className="card" style={{marginBottom:"1rem",display:"flex",alignItems:"center",gap:12}}>
            <div>
              <div style={{fontSize:12,color:"var(--muted)",marginBottom:2}}>Your self-rating</div>
              <div style={{fontSize:18}}>{"⭐".repeat(selfRating)}</div>
            </div>
            {reflection&&<div style={{fontSize:13,color:"var(--mid)",lineHeight:1.5,borderLeft:"2px solid var(--border)",paddingLeft:12,flex:1}}>{reflection}</div>}
          </div>
        )}

        {finalFeedback&&(
          <>
            <div className="fb-card" style={{background:rs.bg,borderColor:rs.border,marginBottom:"1rem"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span className="badge" style={{background:rs.color,color:"white"}}>Overall: {rs.label}</span>
                {isCrisis&&<span className="badge" style={{background:"var(--indigo-pale)",color:"var(--indigo)"}}>Crisis response</span>}
              </div>
              <p style={{fontSize:14,lineHeight:1.6,color:"var(--charcoal)"}}>{finalFeedback.summary}</p>
            </div>
            <div className="debrief-grid">
              <div className="card" style={{background:"var(--sage-pale)",borderColor:"var(--sage-mid)"}}>
                <div className="fb-label" style={{color:"var(--sage)"}}>Strengths</div>
                {(finalFeedback.strengths||[]).map((s,i)=><p key={i} style={{fontSize:13,color:"var(--sage)",margin:"0 0 4px",lineHeight:1.5}}>· {s}</p>)}
              </div>
              <div className="card" style={{background:"var(--amber-pale)",borderColor:"var(--amber-mid)"}}>
                <div className="fb-label" style={{color:"var(--amber)"}}>To develop</div>
                {(finalFeedback.areas||[]).map((a,i)=><p key={i} style={{fontSize:13,color:"var(--amber)",margin:"0 0 4px",lineHeight:1.5}}>· {a}</p>)}
              </div>
            </div>
            <div className="card" style={{marginBottom:"0.75rem",marginTop:"0.5rem"}}>
              <div className="fb-label">Use of {getApLabel(approach)}</div>
              <p style={{fontSize:13,color:"var(--mid)",lineHeight:1.6,margin:0}}>{finalFeedback.technique_use}</p>
            </div>
            {finalFeedback.relational_quality&&(
              <div className="card" style={{marginBottom:"0.75rem"}}>
                <div className="fb-label">Therapeutic relationship</div>
                <p style={{fontSize:13,color:"var(--mid)",lineHeight:1.6,margin:0}}>{finalFeedback.relational_quality}</p>
              </div>
            )}
            {finalFeedback.key_moment&&(
              <div className="card" style={{marginBottom:"0.75rem",background:"var(--amber-pale)",borderColor:"var(--amber-mid)"}}>
                <div className="fb-label" style={{color:"var(--amber)"}}>⭐ Key moment</div>
                <p style={{fontSize:13,color:"var(--amber)",lineHeight:1.6,margin:0}}>{finalFeedback.key_moment}</p>
              </div>
            )}
            {finalFeedback.example_response&&(
              <div className="card" style={{background:"var(--indigo-pale)",borderColor:"var(--indigo-mid)",marginBottom:"1rem"}}>
                <div className="fb-label" style={{color:"var(--indigo)"}}>Stronger response example</div>
                <p style={{fontSize:13,color:"var(--indigo)",fontStyle:"italic",lineHeight:1.6,margin:0}}>{finalFeedback.example_response}</p>
              </div>
            )}

            {/* Smart drill recommendation based on feedback */}
            {(()=>{
              const areas=(finalFeedback.areas||[]).join(" ").toLowerCase();
              const techUse=(finalFeedback.technique_use||"").toLowerCase();
              const summary=(finalFeedback.summary||"").toLowerCase();
              const combined=areas+" "+techUse+" "+summary;
              let recommended=null;
              if(combined.match(/reflect|feeling|emotion|empathy|empathic/)) recommended=DRILLS.find(d=>d.id==="reflection")||DRILLS.find(d=>d.id==="empathy");
              else if(combined.match(/question|closed|open question/)) recommended=DRILLS.find(d=>d.id==="open_q");
              else if(combined.match(/paraphras|restat/)) recommended=DRILLS.find(d=>d.id==="paraphrase");
              else if(combined.match(/summar/)) recommended=DRILLS.find(d=>d.id==="summarise");
              else if(combined.match(/challeng|inconsisten|avoid/)) recommended=DRILLS.find(d=>d.id==="challenging");
              else if(combined.match(/refram|perspect|alternative/)) recommended=DRILLS.find(d=>d.id==="reframing");
              else if(combined.match(/notic|notic|present|aware/)) recommended=DRILLS.find(d=>d.id==="noticing");
              if(!recommended) return null;
              return(
                <div style={{margin:"0 0 1rem",padding:"12px 14px",borderRadius:"var(--r-lg)",background:"var(--teal-pale)",border:"1px solid var(--teal-mid)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:"var(--teal)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>💡 Recommended drill</div>
                    <div style={{fontSize:14,fontWeight:500,color:"var(--charcoal)"}}>{recommended.emoji} {recommended.label}</div>
                    <div style={{fontSize:12,color:"var(--mid)",marginTop:2}}>{recommended.desc} · 4 exchanges · +1pt</div>
                  </div>
                  <button className="btn" style={{background:"var(--teal)",color:"white",fontSize:13,padding:"8px 16px",flexShrink:0}}
                    onClick={()=>startDrill(recommended)}>
                    Start drill →
                  </button>
                </div>
              );
            })()}
          </>
        )}

        {/* Post-debrief feedback — MUST submit to save everything */}
        <div className="post-debrief-form">
          <div style={{fontWeight:600,fontSize:14,color:"var(--teal)",marginBottom:4}}>🧪 Help us improve — 3 quick questions</div>
          <p style={{fontSize:12,color:"var(--teal)",opacity:0.8,marginBottom:14}}>Your session is saved when you submit this — it only takes a moment.</p>

          <div style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:500,color:"var(--mid)",marginBottom:6}}>How useful was the supervisor feedback?</div>
            <div className="star-row">
              {[1,2,3,4,5].map(n=>(
                <button key={n} className={`star-btn ${debriefRating>=n?"active":""}`}
                  style={{borderColor:debriefRating>=n?"var(--teal)":"var(--border)",background:debriefRating>=n?"var(--teal-pale)":"var(--cream)"}}
                  onClick={()=>setDebriefRating(debriefRating===n?0:n)}>
                  {debriefRating>=n?"⭐":"☆"}
                </button>
              ))}
              {debriefRating>0&&<span style={{fontSize:13,color:"var(--teal)",marginLeft:4}}>
                {["","Not useful","Slightly useful","Somewhat useful","Very useful","Excellent"][debriefRating]}
              </span>}
            </div>
          </div>

          <div style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:500,color:"var(--mid)",marginBottom:6}}>Anything the feedback missed or got wrong? <span style={{fontWeight:400,color:"var(--muted)"}}>(optional)</span></div>
            <textarea rows={2} placeholder="e.g. It didn't pick up that I used a scaling question… / The feedback felt too generic…"
              value={debriefMissed} onChange={e=>setDebriefMissed(e.target.value)}/>
          </div>

          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:500,color:"var(--mid)",marginBottom:6}}>Did the AI client feel realistic?</div>
            <div className="realism-row">
              {REALISM_OPTIONS.map(opt=>(
                <button key={opt.id} className={`realism-btn ${clientRealism===opt.id?"active":""}`}
                  onClick={()=>setClientRealism(clientRealism===opt.id?"":opt.id)}>
                  {opt.label}
                </button>
              ))}
            </div>
          </div>

          {!feedbackSaved
            ? <button className="btn" style={{background:"var(--teal)",color:"white",fontSize:13,padding:"9px 20px"}}
                onClick={submitPostFeedback} disabled={savingFeedback}>
                {savingFeedback?"Saving…":"Submit & save session"}
              </button>
            : <div style={{fontSize:13,color:"var(--teal)",fontWeight:500}}>✓ Session saved — thank you for your feedback.</div>
          }
        </div>

        {/* Download */}
        <div className="card" style={{marginBottom:"1rem",background:"var(--sage-pale)",borderColor:"var(--sage-mid)"}}>
          <div className="fb-label" style={{color:"var(--sage)",marginBottom:8}}>Download your summary</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn" style={{background:"var(--sage)",color:"white",fontSize:13,padding:"8px 16px"}}
              onClick={()=>generatePDF({includeTranscript:false,studentName,sessionDate,scenario,approach:getApLabel(approach),difficulty,exchanges:exchangeCount,msgReactions,msgNotes,selfRating,reflection,debrief:finalFeedback,debriefRating,debriefMissed,clientRealism,messages})}>
              📄 Summary only
            </button>
            <button className="btn btn-ghost" style={{fontSize:13,padding:"8px 16px",border:"1px solid var(--sage-mid)",color:"var(--sage)"}}
              onClick={()=>generatePDF({includeTranscript:true,studentName,sessionDate,scenario,approach:getApLabel(approach),difficulty,exchanges:exchangeCount,msgReactions,msgNotes,selfRating,reflection,debrief:finalFeedback,debriefRating,debriefMissed,clientRealism,messages})}>
              📋 With full transcript
            </button>
          </div>
          <p style={{fontSize:11,color:"var(--sage)",marginTop:8,opacity:0.8}}>Opens print dialog — choose "Save as PDF" to download.</p>
        </div>

        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary" style={{flex:1,padding:"12px"}} onClick={reset}>New session</button>
          <button className="btn btn-ghost" style={{padding:"12px 16px"}} onClick={()=>setScreen("progress")}>Progress</button>
        </div>

        {/* Waitlist */}
        {!waitlistSent ? (
          <div className="waitlist-form" style={{marginTop:"1rem"}}>
            <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>🚀 Early access pricing</div>
            <p style={{fontSize:13,opacity:0.9,marginBottom:12,lineHeight:1.6}}>We're launching a paid plan soon. Join the waitlist and get <strong>founding member pricing</strong> — locked in for life.</p>
            <div style={{display:"flex",gap:8}}>
              <input type="email" placeholder="your@email.com" value={waitlistEmail} onChange={e=>setWaitlistEmail(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter") submitWaitlist();}}/>
              <button className="btn" style={{background:"white",color:"var(--sage)",fontWeight:600,fontSize:13,padding:"10px 16px",flexShrink:0,whiteSpace:"nowrap"}}
                onClick={submitWaitlist} disabled={waitlistLoading}>
                {waitlistLoading?"...":"Join waitlist"}
              </button>
            </div>
            <p style={{fontSize:11,opacity:0.7,marginTop:8}}>No spam. Just a heads-up when we launch.</p>
          </div>
        ) : (
          <div style={{marginTop:"1rem",padding:"12px 16px",background:"var(--sage-pale)",border:"1px solid var(--sage-mid)",borderRadius:"var(--r-lg)",fontSize:13,color:"var(--sage)",fontWeight:500,textAlign:"center"}}>
            ✓ You're on the list — we'll be in touch with founding member pricing.
          </div>
        )}
      </div>
    );
  }

  // ── DRILL SCREEN ──
  if(screen==="drill" && activeDrill){
    return(
      <div className="session-layout">
        <div className="session-header">
          <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
            <span className="badge" style={{background:"var(--teal-pale)",color:"var(--teal)"}}>{activeDrill.emoji} {activeDrill.label}</span>
            <span className="badge" style={{background:"var(--border-light)",color:"var(--mid)"}}>{activeDrill.scenario?.label}</span>
            <span className="badge" style={{background:activeDrill.difficulty?.pale,color:activeDrill.difficulty?.color}}>{activeDrill.difficulty?.label}</span>
          </div>
          <button className="btn btn-ghost" style={{padding:"5px 12px",fontSize:13}} onClick={()=>{ setScreen("home"); setActiveDrill(null); }}>End</button>
        </div>

        <div style={{background:"var(--teal-pale)",borderBottom:"1px solid var(--teal-mid)",padding:"8px 14px",flexShrink:0}}>
          <p style={{fontSize:12,color:"var(--teal)",lineHeight:1.5,margin:0}}>
            <strong>Focus:</strong> {activeDrill.prompt} · {Math.max(0,4-drillExchange)} exchanges remaining
          </p>
        </div>

        <div className="chat-area">
          {drillMessages.map((m,i)=>{
            const fb=drillFeedbacks.find(f=>f.msgId===m.id);
            return(
              <div key={i}>
                <div className={`msg-wrap ${m.role}`}>
                  <div className="msg-bubble">
                    <div className="msg-label">{m.role==="counsellor"?"You (Counsellor)":"Client"}</div>
                    {m.text}
                  </div>
                </div>
                {fb&&(
                  <div style={{margin:"4px 0 8px",padding:"8px 12px",borderRadius:"var(--r)",background:fb.rating==="good"?"var(--sage-pale)":fb.rating==="okay"?"var(--amber-pale)":"var(--red-pale)",border:`1px solid ${fb.rating==="good"?"var(--sage-mid)":fb.rating==="okay"?"var(--amber-mid)":"var(--red-mid)"}`,fontSize:13}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <span style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:fb.rating==="good"?"var(--sage)":fb.rating==="okay"?"var(--amber)":"var(--red)"}}>
                        {fb.did_the_skill?"✓ Yes":"✗ Not quite"} — {activeDrill.label}
                      </span>
                    </div>
                    <p style={{margin:"0 0 4px",color:"var(--charcoal)",lineHeight:1.5}}>{fb.feedback}</p>
                    <p style={{margin:0,color:"var(--mid)",fontStyle:"italic",lineHeight:1.5}}>💡 {fb.tip}</p>
                  </div>
                )}
              </div>
            );
          })}

          {drillLoading&&(
            <div className="msg-wrap client">
              <div className="typing-bubble"><div className="dot"/><div className="dot"/><div className="dot"/></div>
            </div>
          )}

          {drillDone&&(
            <div style={{padding:"16px",borderRadius:"var(--r-lg)",background:"var(--teal-pale)",border:"1px solid var(--teal-mid)",textAlign:"center",margin:"8px 0"}}>
              <div style={{fontSize:20,marginBottom:4}}>✨ Drill complete!</div>
              <div style={{fontSize:14,color:"var(--teal)",fontWeight:600,marginBottom:4}}>+1 point earned</div>
              <div style={{fontSize:13,color:"var(--mid)",marginBottom:12}}>
                {drillFeedbacks.filter(f=>f.did_the_skill).length} of {drillFeedbacks.length} responses demonstrated {activeDrill.label.toLowerCase()} effectively.
              </div>
              <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                <button className="btn btn-primary" style={{fontSize:13}} onClick={()=>startDrill(activeDrill)}>Try again</button>
                <button className="btn btn-ghost" style={{fontSize:13}} onClick={()=>{ setScreen("home"); setActiveDrill(null); }}>Back to home</button>
              </div>
            </div>
          )}

          <div ref={bottomRef}/>
        </div>

        {!drillDone&&(
          <div className="input-area">
            <div className="input-row">
              <textarea className="chat-input" rows={1} value={drillInput}
                onChange={e=>{setDrillInput(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px";}}
                onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendDrillMessage();}}}
                placeholder={`Practise ${activeDrill.label.toLowerCase()} here…`} disabled={drillLoading}/>
              <button className="send-btn" disabled={drillLoading||!drillInput.trim()} onClick={sendDrillMessage}>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8l12-6-5 14-2-5-5-3z" stroke="white" strokeWidth="1.5" strokeLinejoin="round" fill="none"/></svg>
              </button>
            </div>
            <p style={{fontSize:11,color:"var(--muted)",textAlign:"center",marginTop:5}}>Enter to send · Shift+Enter for new line</p>
          </div>
        )}
      </div>
    );
  }

  if(screen==="progress"){
    const {sessions,totalSessions,totalPoints}=progress;
    const good=sessions.filter(s=>s.overall==="good").length;
    const okay=sessions.filter(s=>s.overall==="okay").length;
    const nw=sessions.filter(s=>s.overall==="needs_work").length;
    const crisis=sessions.filter(s=>s.crisis).length;
    const levels=[{label:"Trainee",max:10,color:"var(--muted)"},{label:"Practitioner",max:25,color:"var(--teal)"},{label:"Skilled",max:50,color:"var(--sage)"},{label:"Advanced",max:100,color:"var(--amber)"},{label:"Expert",max:null,color:"var(--red)"}];
    const level=levels.find(l=>l.max===null||totalPoints<l.max)||levels[levels.length-1];
    const pct=level.max?Math.min(100,Math.round((totalPoints/level.max)*100)):100;
    const apCounts={};sessions.forEach(s=>{apCounts[s.approach]=(apCounts[s.approach]||0)+1;});
    const topAp=Object.entries(apCounts).sort((a,b)=>b[1]-a[1])[0];
    return(
      <div className="page">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.5rem"}}>
          <div style={{fontFamily:"Instrument Serif, serif",fontSize:24}}>Progress Tracker</div>
          <button className="btn btn-ghost" style={{fontSize:13}} onClick={()=>setScreen("home")}>← Back</button>
        </div>
        <div className="card" style={{marginBottom:"1rem"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div><div style={{fontSize:12,color:"var(--muted)",marginBottom:2}}>Current level</div><div style={{fontSize:22,fontWeight:600,color:level.color,fontFamily:"Instrument Serif, serif"}}>{level.label}</div></div>
            <div style={{textAlign:"right"}}><div style={{fontSize:12,color:"var(--muted)",marginBottom:2}}>Total points</div><div style={{fontSize:22,fontWeight:600}}>{totalPoints}</div></div>
          </div>
          <div style={{height:6,background:"var(--border-light)",borderRadius:3,overflow:"hidden",margin:"6px 0"}}>
            <div style={{height:"100%",borderRadius:3,transition:"width 0.4s ease",width:`${pct}%`,background:level.color}}/>
          </div>
          <p style={{fontSize:12,color:"var(--muted)",margin:"5px 0 0"}}>{level.max?`${totalPoints} / ${level.max} pts`:"Maximum level reached"}</p>
        </div>
        <div className="stat-grid" style={{marginBottom:"1rem"}}>
          {[{label:"Sessions",val:totalSessions,color:"var(--charcoal)"},{label:"Good",val:good,color:"var(--sage)"},{label:"Okay",val:okay,color:"var(--amber)"},{label:"Needs work",val:nw,color:"var(--red)"},{label:"Crisis",val:crisis,color:"var(--indigo)"}].map(({label,val,color})=>(
            <div key={label} className="stat-card"><div className="stat-num" style={{color}}>{val}</div><div className="stat-label">{label}</div></div>
          ))}
        </div>
        {topAp&&(<div className="card" style={{marginBottom:"1rem"}}><div style={{fontSize:12,color:"var(--muted)",marginBottom:2}}>Most practised</div><div style={{fontSize:15,fontWeight:500}}>{topAp[0]} <span style={{color:"var(--muted)",fontWeight:400,fontSize:13}}>({topAp[1]} sessions)</span></div></div>)}
        <div style={{fontWeight:600,fontSize:14,margin:"0 0 0.6rem"}}>Session history</div>
        {sessions.length===0
          ?<p style={{color:"var(--muted)",fontSize:14}}>No sessions yet — complete a role-play to see your history.</p>
          :<div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:"1rem"}}>
            {sessions.map((s,i)=>{
              const rs=ratingStyle(s.overall);
              return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:"var(--r)",background:"var(--warm)",border:"1px solid var(--border-light)"}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:rs.color,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.scenario}{s.crisis&&<span style={{fontSize:10,background:"var(--indigo-pale)",color:"var(--indigo)",padding:"1px 6px",borderRadius:10,marginLeft:4}}>Crisis</span>}</div>
                  <div style={{fontSize:12,color:"var(--muted)"}}>{s.approach} · {s.difficulty} · {s.exchanges} exchanges</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:12,fontWeight:500,color:rs.color}}>{rs.label}</div>
                  <div style={{fontSize:11,color:"var(--muted)"}}>+{s.points} pts · {s.date}</div>
                </div>
              </div>);
            })}
          </div>
        }
        {sessions.length>0&&(
          <button onClick={()=>{if(window.confirm("Clear all progress? This cannot be undone.")){const e={sessions:[],totalSessions:0,totalPoints:0};setProgress(e);saveProg(e);}}}
            style={{fontSize:13,color:"var(--red)",background:"none",border:"1px solid var(--red-mid)",borderRadius:"var(--r)",padding:"6px 14px",cursor:"pointer"}}>
            Clear all progress
          </button>
        )}
      </div>
    );
  }
  return null;
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
